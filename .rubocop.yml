# frozen_string_literal: true

plugins:
  - officer_neetzsche

AllCops:
  NewCops: enable
  SuggestExtensions: false
  # TargetRubyVersion is intentionally unset: RuboCop then reads .ruby-version,
  # the single source of truth for the Ruby version used by the action, by CI
  # and here. Hardcoding it made linting inspect a language version nobody ran.

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false
